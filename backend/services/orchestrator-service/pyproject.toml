[project]
name = "tagent-orchestrator-service"
version = "0.1.0"
description = "LangGraph orchestration microservice for Tagent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "mcp>=1.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "msal>=1.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tagent"]
