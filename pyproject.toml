[project]
name = "tagent"
version = "0.1.0"
description = "Autonomous Teams AI Agent — LangGraph + MCP + Microsoft Graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "botbuilder-core>=4.16",
    "botbuilder-schema>=4.16",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "mcp>=1.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.9.4",
    "prek>=0.3.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.bandit]
exclude_dirs = [".venv", "venv", "build", "dist", "tests"]
skips = ["B101"]

[tool.prek]
minimum_prek_version = "0.3.13"
default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit"]
fail_fast = false
exclude = "^(\\.venv|venv|build|dist)/"

[[tool.prek.repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.12"
hooks = [
    { id = "ruff", args = ["--fix"] },
    { id = "ruff-format" },
]

[[tool.prek.repos]]
repo = "https://github.com/PyCQA/bandit"
rev = "1.8.6"
hooks = [
    { id = "bandit", args = ["-c", "pyproject.toml"] },
]
